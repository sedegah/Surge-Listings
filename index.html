<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surge Solutions — Public Asset Marketplace</title>
<meta name="description" content="Surge Solutions is a licensed intermediary platform for bank-repossessed and distressed asset disposition in Ghana. Browse verified listings, complete KYC, and submit purchase offers.">
<link rel="stylesheet" href="styles.css">
</head>
<body data-portal="public">

<div class="viewport" style="top:0;padding:18px">
  <!-- PUBLIC MARKETPLACE -->
  <section class="app active" id="app-public">
    <div class="window" style="background:var(--win-bg)">
      <div class="pub">
        <header class="pub-header">
          <div class="pub-logo" onclick="PublicMarket.goHome()"><span class="sq"></span>Surge Solutions <small>Marketplace</small></div>
          <nav class="pub-nav" id="pub-nav">
            <a data-page="home" class="active" onclick="PublicMarket.goHome()">Buy Assets</a>
            <a data-page="how" onclick="PublicMarket.goHow()">How It Works</a>
            <a data-page="kyc" onclick="PublicMarket.goKyc()">KYC &amp; Verification</a>
            <a data-page="faq" onclick="PublicMarket.goFaq()">FAQ</a>
            <a data-page="contact" onclick="PublicMarket.goContact()">Contact</a>
          </nav>
          <span class="spacer"></span>
          <div class="contact"><b>Listed and managed by Surge Solutions</b><br>Buyer enquiries only · No direct seller contact</div>
          <div id="pub-auth-container" style="margin-left:12px">
            <a href="login.html" id="pub-auth-btn" class="btn small" style="background:var(--blue);color:#fff;border-color:var(--blue);text-decoration:none">Staff Sign In</a>
          </div>
        </header>
        <div class="pub-body" id="public-work"></div>
      </div>
    </div>
  </section>
</div>

<div class="surge-toast" id="toast"></div>
<div class="surge-modal-backdrop" id="modal-backdrop">
  <div class="surge-modal-window" id="modal-window">
    <div class="surge-modal-header">
      <h3 id="modal-title">Dialog</h3>
      <button class="surge-modal-close" onclick="UI.closeModal()">&times;</button>
    </div>
    <div class="surge-modal-body" id="modal-body"></div>
    <div class="surge-modal-footer" id="modal-footer"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
