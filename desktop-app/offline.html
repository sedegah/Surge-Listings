<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surge Listings · Connection Unavailable</title>
<style>
  :root {
    --blue: #0B3C75;
    --blue-hover: #092F5C;
    --red: #B3262E;
    --win-bg: #E8EEF5;
    --panel: #FFFFFF;
    --border: #CBD5E1;
    --text: #1E293B;
    --text-muted: #64748B;
    --font: "Segoe UI", Inter, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: var(--font);
    background: var(--win-bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
  }
  .card {
    width: 520px;
    max-width: 90vw;
    background: var(--panel);
    border: 1px solid var(--border);
    box-shadow: 0 16px 36px rgba(11, 60, 117, 0.12), 0 2px 6px rgba(0, 0, 0, 0.05);
    border-radius: 4px;
    overflow: hidden;
  }
  .card-header {
    height: 38px;
    background: var(--blue);
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    font-size: 12.5px;
    font-weight: 600;
  }
  .card-header .brand {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .card-header .sq {
    width: 9px;
    height: 9px;
    background: var(--red);
    display: inline-block;
    border-radius: 1px;
  }
  .card-header .badge {
    font-size: 10.5px;
    background: rgba(255, 255, 255, 0.15);
    padding: 2px 8px;
    border-radius: 2px;
    font-weight: 500;
  }
  .card-body {
    padding: 36px 32px 28px;
    text-align: center;
  }
  .icon-wrapper {
    width: 56px;
    height: 56px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: #FEE2E2;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--red);
  }
  .icon-wrapper svg {
    width: 28px;
    height: 28px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  h1 {
    font-size: 19px;
    margin: 0 0 10px;
    color: var(--blue);
    font-weight: 600;
  }
  p {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.6;
    margin: 0 0 24px;
  }
  .actions {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 24px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 9px 22px;
    font-size: 13px;
    font-weight: 600;
    border-radius: 3px;
    cursor: pointer;
    border: none;
    font-family: inherit;
    transition: background 0.15s ease;
  }
  .btn-primary {
    background: var(--blue);
    color: #FFFFFF;
  }
  .btn-primary:hover:not(:disabled) {
    background: var(--blue-hover);
  }
  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .card-footer {
    background: #F8FAFC;
    border-top: 1px solid #E2E8F0;
    padding: 12px 16px;
    font-size: 11.5px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .status-indicator {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #EF4444;
  }
  .status-dot.online {
    background: #10B981;
  }
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-top-color: #FFFFFF;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <div class="brand">
      <span class="sq"></span>
      <span>Surge Listings Desktop</span>
    </div>
    <span class="badge">OFFLINE</span>
  </div>
  <div class="card-body">
    <div class="icon-wrapper">
      <svg viewBox="0 0 24 24">
        <path d="M1 1l22 22"></path>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>Unable to Reach Surge Cloud</h1>
    <p>
      The desktop application cannot connect to the live Surge Listings platform.
      Please check your network connection and click Retry once reconnected.
    </p>
    <div class="actions">
      <button class="btn btn-primary" id="retry-btn" onclick="retry()">
        <span id="btn-text">Retry Connection</span>
      </button>
    </div>
  </div>
  <div class="card-footer">
    <div class="status-indicator">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Disconnected</span>
    </div>
    <span>Surge Solutions Enterprise</span>
  </div>
</div>

<script>
  function retry() {
    const btn = document.getElementById('retry-btn');
    const btnText = document.getElementById('btn-text');
    btn.disabled = true;
    btnText.innerHTML = '<span class="spinner"></span> Connecting...';

    if (window.surgeDesktop && typeof window.surgeDesktop.retryConnection === 'function') {
      window.surgeDesktop.retryConnection();
    } else {
      setTimeout(() => {
        window.location.reload();
      }, 1000);
    }
  }

  // Auto-retry when OS signals connectivity is restored
  window.addEventListener('online', () => {
    document.getElementById('status-dot').classList.add('online');
    document.getElementById('status-text').textContent = 'Reconnecting...';
    setTimeout(retry, 500);
  });
</script>

</body>
</html>
