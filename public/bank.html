<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surge Solutions — Bank Partner Portal</title>
<meta name="description" content="Surge Solutions Bank Portal — Multi-tenant loan recovery and asset management platform for Ghanaian financial institutions.">
<link rel="stylesheet" href="styles.css">
<style>
body[data-portal="bank"]:not(.auth-ready) > :not(#portal-auth-status) { visibility: hidden; }
#portal-auth-status { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; text-align: center; background: #DCDCDC; color: #1F1F1F; font: 14px "Segoe UI", Inter, Arial, sans-serif; }
body.auth-ready #portal-auth-status { display: none; }
</style>
</head>
<body data-portal="bank">
<div id="portal-auth-status" role="status" aria-live="polite">Verifying your session…</div>
<nav class="switcher">
  <span class="brandmark">SURGE <span>&#9632;</span></span>
  <button data-app="bank" class="active">Bank Portal</button>
  <a href="admin.html" id="admin-portal-link" class="switcher-link" hidden style="color:#C8C8C8;padding:5px 12px;font-size:12px">Surge Admin</a>
  <a href="marketplace.html" class="switcher-link" style="color:#C8C8C8;padding:5px 12px;font-size:12px">Marketplace</a>
  <button class="switcher-signout" type="button" onclick="Auth.logout()" aria-label="Sign out of the bank portal">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/></svg>
    <span>Sign out</span>
  </button>
</nav>

<div class="viewport">
  <!-- BANK PORTAL -->
  <section class="app active" id="app-bank">
    <div class="window">
      <div class="menubar">
        <span class="app-title"><span class="sq"></span>Surge Solutions</span>
        <span class="menu-item" onclick="BankPortal.nav('assets')"><u>A</u>ssets</span>
        <span class="menu-item" onclick="BankPortal.nav('legal')"><u>L</u>egal</span>
        <span class="menu-item" onclick="BankPortal.nav('offers')"><u>S</u>ales</span>
        <span class="menu-item" onclick="BankPortal.nav('reports')"><u>R</u>eports</span>
        <span class="menu-spacer"></span>
        <span class="menu-env">BANK PORTAL</span>
      </div>
      <div class="toolbar">
        <button class="tbtn" onclick="BankPortal.newAsset()"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New</button>
        <button class="tbtn" onclick="BankPortal.saveCurrent()"><svg class="ico" viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v6h7V4"/><path d="M8 20v-6h8v6"/></svg>Save</button>
        <span class="tsep"></span>
        <button class="tbtn" onclick="BankPortal.submitCurrent()"><svg class="ico" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6z"/></svg>Submit for Review</button>
        <span class="tsep"></span>
        <button class="tbtn" onclick="UI.exportPDF()"><svg class="ico" viewBox="0 0 24 24"><path d="M7 9V4h10v5"/><rect x="4" y="9" width="16" height="8" rx="1"/><path d="M7 17h10v4H7z"/></svg>Print</button>
        <button class="tbtn" onclick="UI.exportExcel('assets')"><svg class="ico" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M8 11l4 4 4-4"/><path d="M5 20h14"/></svg>Export</button>
        <span class="tsep"></span>
        <span style="font-size:11.5px;color:var(--text-2);font-weight:600;display:inline-flex;align-items:center;gap:4px">
          Branch:
          <select id="bank-branch-select" style="height:24px;font-size:11.5px;padding:1px 6px;border:1px solid var(--border);border-radius:2px" onchange="BankPortal.switchBranch(this.value)">
            <option value="">All Branches</option>
          </select>
        </span>
        <span class="tsep"></span>
      </div>
      <div class="mainrow">
        <nav class="navpane" id="bank-nav">
          <div class="navitem" data-view="dashboard"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Dashboard</div>
          <div class="navitem active" data-view="assets"><svg class="ico" viewBox="0 0 24 24"><path d="M3 10l9-6 9 6"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>My Assets</div>
          <div class="navitem" data-view="legal"><svg class="ico" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/></svg>Legal &amp; Enforcement</div>
          <div class="navitem" data-view="documents"><svg class="ico" viewBox="0 0 24 24"><path d="M4 20l7-2 9-9-5-5-9 9z"/><path d="M14 4l5 5"/></svg>Title &amp; Documents</div>
          <div class="navitem" data-view="offers"><svg class="ico" viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg>Offers &amp; Decisions</div>
          <div class="navitem" data-view="reports"><svg class="ico" viewBox="0 0 24 24"><path d="M5 20V9M12 20V4M19 20v-7"/></svg>Reports</div>
          <div class="navitem" data-view="notifications"><svg class="ico" viewBox="0 0 24 24"><path d="M6 16V9a6 6 0 0112 0v7"/><path d="M4 16h16v4H4z"/></svg>Notifications</div>
        </nav>
        <div class="workspace">
          <div class="doctabs" id="bank-doctabs"></div>
          <main class="work" id="bank-work"></main>
          <footer class="statusbar">
            <span class="cell">User: <b id="profile-user-bank">—</b></span>
            <span class="cell">Role: <b id="profile-role-bank">—</b></span>
            <span class="cell">Org: <b id="profile-org-bank">—</b></span>
            <span class="cell grow" id="clock-bank"></span>
          </footer>
        </div>
      </div>
    </div>
  </section>
</div>

<div class="surge-toast" id="toast"></div>
<div class="surge-modal-backdrop" id="modal-backdrop">
  <div class="surge-modal-window" id="modal-window">
    <div class="surge-modal-header">
      <h3 id="modal-title">Dialog</h3>
      <button class="surge-modal-close" onclick="UI.closeModal()">&times;</button>
    </div>
    <div class="surge-modal-body" id="modal-body"></div>
    <div class="surge-modal-footer" id="modal-footer"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
