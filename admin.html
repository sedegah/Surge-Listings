<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surge Solutions - Administration Portal</title>
<meta name="description" content="Surge Solutions Super Administrator Portal — Platform oversight, 5-gate publish readiness verification, legal holds, bank partner management, and audit records.">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="notifications.css">
<style>
body[data-portal="admin"]:not(.auth-ready) > :not(#portal-auth-status) { visibility: hidden; }
#portal-auth-status { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; text-align: center; background: #DCDCDC; color: #1F1F1F; font: 14px "Segoe UI", Inter, Arial, sans-serif; }
body.auth-ready #portal-auth-status { display: none; }
</style>
</head>
<body data-portal="admin">
<div id="portal-auth-status" role="status" aria-label="Loading workspace">
  <div class="portal-skeleton">
    <div class="portal-skeleton-header">
      <div class="portal-skeleton-nav">
        <div class="portal-skeleton-pill skeleton-shimmer" style="width:110px"></div>
        <div class="portal-skeleton-pill skeleton-shimmer" style="width:80px"></div>
        <div class="portal-skeleton-pill skeleton-shimmer" style="width:90px"></div>
      </div>
      <div class="portal-skeleton-pill skeleton-shimmer" style="width:85px"></div>
    </div>
    <div class="portal-skeleton-body">
      <div class="portal-skeleton-titlebar">
        <div style="display:flex;flex-direction:column;gap:6px">
          <div class="skeleton-shimmer" style="width:180px;height:24px"></div>
          <div class="skeleton-shimmer" style="width:280px;height:14px"></div>
        </div>
        <div class="skeleton-shimmer" style="width:120px;height:28px"></div>
      </div>
      <div class="portal-skeleton-kpis">
        <div class="portal-skeleton-kpi">
          <div class="skeleton-shimmer" style="width:80px;height:12px"></div>
          <div class="skeleton-shimmer" style="width:50px;height:26px"></div>
          <div class="skeleton-shimmer" style="width:110px;height:10px"></div>
        </div>
        <div class="portal-skeleton-kpi">
          <div class="skeleton-shimmer" style="width:80px;height:12px"></div>
          <div class="skeleton-shimmer" style="width:40px;height:26px"></div>
          <div class="skeleton-shimmer" style="width:120px;height:10px"></div>
        </div>
        <div class="portal-skeleton-kpi">
          <div class="skeleton-shimmer" style="width:90px;height:12px"></div>
          <div class="skeleton-shimmer" style="width:45px;height:26px"></div>
          <div class="skeleton-shimmer" style="width:100px;height:10px"></div>
        </div>
        <div class="portal-skeleton-kpi">
          <div class="skeleton-shimmer" style="width:80px;height:12px"></div>
          <div class="skeleton-shimmer" style="width:35px;height:26px"></div>
          <div class="skeleton-shimmer" style="width:130px;height:10px"></div>
        </div>
        <div class="portal-skeleton-kpi">
          <div class="skeleton-shimmer" style="width:95px;height:12px"></div>
          <div class="skeleton-shimmer" style="width:40px;height:26px"></div>
          <div class="skeleton-shimmer" style="width:115px;height:10px"></div>
        </div>
      </div>
      <div class="portal-skeleton-gridwrap">
        <div class="portal-skeleton-toolbar">
          <div class="skeleton-shimmer" style="width:240px;height:26px"></div>
          <div style="display:flex;gap:8px">
            <div class="skeleton-shimmer" style="width:90px;height:26px"></div>
            <div class="skeleton-shimmer" style="width:90px;height:26px"></div>
          </div>
        </div>
        <div class="portal-skeleton-table">
          <div class="portal-skeleton-row header">
            <div class="skeleton-shimmer" style="width:140px;height:12px"></div>
            <div class="skeleton-shimmer" style="width:100px;height:12px"></div>
            <div class="skeleton-shimmer" style="width:180px;height:12px"></div>
            <div class="skeleton-shimmer" style="width:120px;height:12px"></div>
            <div class="skeleton-shimmer" style="width:90px;height:12px"></div>
            <div class="skeleton-shimmer" style="width:80px;height:12px;margin-left:auto"></div>
          </div>
          <div class="portal-skeleton-row">
            <div class="skeleton-shimmer" style="width:120px;height:14px"></div>
            <div class="skeleton-shimmer" style="width:90px;height:14px"></div>
            <div class="skeleton-shimmer" style="width:220px;height:14px"></div>
            <div class="skeleton-shimmer" style="width:100px;height:14px"></div>
            <div class="skeleton-shimmer" style="width:75px;height:18px;border-radius:10px"></div>
            <div class="skeleton-shimmer" style="width:70px;height:24px;margin-left:auto"></div>
          </div>
          <div class="portal-skeleton-row">
            <div class="skeleton-shimmer" style="width:130px;height:14px"></div>
            <div class="skeleton-shimmer" style="width:85px;height:14px"></div>
            <div class="skeleton-shimmer" style="width:190px;height:14px"></div>
            <div class="skeleton-shimmer" style="width:110px;height:14px"></div>
            <div class="skeleton-shimmer" style="width:75px;height:18px;border-radius:10px"></div>
            <div class="skeleton-shimmer" style="width:70px;height:24px;margin-left:auto"></div>
          </div>
          <div class="portal-skeleton-row">
            <div class="skeleton-shimmer" style="width:115px;height:14px"></div>
            <div class="skeleton-shimmer" style="width:95px;height:14px"></div>
            <div class="skeleton-shimmer" style="width:240px;height:14px"></div>
            <div class="skeleton-shimmer" style="width:95px;height:14px"></div>
            <div class="skeleton-shimmer" style="width:75px;height:18px;border-radius:10px"></div>
            <div class="skeleton-shimmer" style="width:70px;height:24px;margin-left:auto"></div>
          </div>
          <div class="portal-skeleton-row">
            <div class="skeleton-shimmer" style="width:125px;height:14px"></div>
            <div class="skeleton-shimmer" style="width:80px;height:14px"></div>
            <div class="skeleton-shimmer" style="width:200px;height:14px"></div>
            <div class="skeleton-shimmer" style="width:105px;height:14px"></div>
            <div class="skeleton-shimmer" style="width:75px;height:18px;border-radius:10px"></div>
            <div class="skeleton-shimmer" style="width:70px;height:24px;margin-left:auto"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<nav class="switcher">
  <span class="brandmark">SURGE <span>&#9632;</span></span>
  <a href="bank.html" class="switcher-link" style="color:#C8C8C8;padding:5px 12px;font-size:12px">Bank Portal</a>
  <button data-app="admin" class="active">Surge Admin</button>
  <a href="marketplace.html" class="switcher-link" style="color:#C8C8C8;padding:5px 12px;font-size:12px">Marketplace</a>
  <button class="switcher-signout" type="button" onclick="Auth.logout()" aria-label="Sign out of the administration portal">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/></svg>
    <span>Sign out</span>
  </button>
</nav>

<div class="viewport">
  <!-- SURGE ADMIN -->
  <section class="app active" id="app-admin">
    <div class="window">
      <div class="menubar">
        <span class="app-title"><span class="sq"></span>Surge Solutions — Administration</span>
        <span class="menu-item" onclick="AdminPortal.nav('assets')"><u>A</u>ssets</span>
        <span class="menu-item" onclick="AdminPortal.nav('review')"><u>R</u>eview</span>
        <span class="menu-item" onclick="AdminPortal.nav('legal')"><u>L</u>egal</span>
        <span class="menu-item" onclick="AdminPortal.nav('title')"><u>T</u>itle &amp; Valuation</span>
        <span class="menu-item" onclick="AdminPortal.nav('banks')"><u>B</u>anks &amp; Staff</span>
        <span class="menu-item" onclick="AdminPortal.nav('audit')"><u>A</u>udit</span>
        <span class="menu-spacer"></span>
        <span class="menu-env">ADMINISTRATION</span>
      </div>
      <div class="toolbar">
        <button class="tbtn" onclick="AdminPortal.nav('review')"><svg class="ico" viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg>Review Queue</button>
        <button class="tbtn" onclick="AdminPortal.publishCurrent()"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Publish</button>
        <button class="tbtn" onclick="AdminPortal.holdCurrent()"><svg class="ico" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="1"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>Legal Hold</button>
        <span class="tsep"></span>
        <button class="tbtn" onclick="AdminPortal.nav('banks')"><svg class="ico" viewBox="0 0 24 24"><path d="M3 21h18M3 10h18M5 6l7-3 7 3M4 10v11M20 10v11M8 14v4M12 14v4M16 14v4"/></svg>Banks &amp; Staff</button>
        <button class="tbtn" onclick="AdminPortal.nav('audit')"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Audit Log</button>
        <span class="tsep"></span>
      </div>
      <div class="mainrow">
        <nav class="navpane" id="admin-nav">
          <div class="navitem" data-view="dashboard"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Dashboard</div>
          <div class="navitem active" data-view="assets"><svg class="ico" viewBox="0 0 24 24"><path d="M3 10l9-6 9 6"/><path d="M5 10v10h14V10"/></svg>Assets</div>
          <div class="navitem" data-view="review"><svg class="ico" viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg>Review Queue</div>
          <div class="navitem" data-view="legal"><svg class="ico" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/></svg>Legal Verification</div>
          <div class="navitem" data-view="title"><svg class="ico" viewBox="0 0 24 24"><path d="M4 20l7-2 9-9-5-5-9 9z"/></svg>Title &amp; Valuation</div>
          <div class="navitem" data-view="offers"><svg class="ico" viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg>Offers</div>
          <div class="navitem" data-view="banks"><svg class="ico" viewBox="0 0 24 24"><path d="M3 21h18M3 10h18M5 6l7-3 7 3M4 10v11M20 10v11M8 14v4M12 14v4M16 14v4"/></svg>Banks &amp; Staff</div>
          <div class="navitem" data-view="audit"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Audit Log</div>
        </nav>
        <div class="workspace">
          <div class="doctabs" id="admin-doctabs"></div>
          <main class="work" id="admin-work"></main>
          <footer class="statusbar">
            <span class="cell">User: <b id="profile-user-admin">—</b></span>
            <span class="cell">Role: <b id="profile-role-admin">—</b></span>
            <span class="cell">Org: <b id="profile-org-admin">—</b></span>
            <span class="cell grow" id="clock-admin"></span>
          </footer>
        </div>
      </div>
    </div>
  </section>
</div>

<div id="surge-notification-container" role="region" aria-label="Notifications" aria-live="polite"></div>
<div class="surge-toast" id="toast" style="display:none"></div>
<div class="surge-modal-backdrop" id="modal-backdrop">
  <div class="surge-modal-window" id="modal-window">
    <div class="surge-modal-header">
      <h3 id="modal-title">Dialog</h3>
      <button class="surge-modal-close" onclick="UI.closeModal()">&times;</button>
    </div>
    <div class="surge-modal-body" id="modal-body"></div>
    <div class="surge-modal-footer" id="modal-footer"></div>
  </div>
</div>

<script src="notifications.js"></script>
<script src="app.js"></script>
</body>
</html>
