<title>Surge Solutions Marketplace (Mockup)</title>
<style>
:root{--blue:#0B3C75;--blue-hover:#092F5C;--red:#B3262E;--text:#1F1F1F;--text-2:#5A5A5A;--warning:#9A6700;--font:"Segoe UI",Inter,Arial,sans-serif;--serif:Georgia,"Times New Roman",serif}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.45 var(--font);color:var(--text);background:#fff;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* Header */
.hdr{position:sticky;top:0;z-index:20;height:64px;background:#fff;border-bottom:1px solid #D5DCE4;display:flex;align-items:center;gap:28px;padding:0 max(24px,calc((100% - 1200px)/2 + 24px))}
.logo{font:700 18px var(--serif);color:var(--blue);display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.logo i{width:10px;height:10px;background:var(--red);border-radius:2px}
.logo small{font:400 12.5px var(--font);color:var(--text-2)}
nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
nav a{padding:8px 12px;font-size:13.5px;color:#33475B;cursor:pointer;white-space:nowrap}
nav a:hover{background:#EEF3F9}
nav a.on{color:var(--blue);font-weight:600;box-shadow:inset 0 -2px 0 var(--red)}
.cta{height:38px;padding:0 16px;border:0;border-radius:4px;background:var(--blue);color:#fff;font:600 13.5px var(--font);cursor:pointer;white-space:nowrap}
.cta:hover{background:var(--blue-hover)}

/* Hero */
.hero{background:var(--blue);color:#fff;padding:56px max(24px,calc((100% - 1200px)/2 + 24px)) 96px;border-bottom:4px solid var(--red)}
.hero h1{font:700 40px/1.15 var(--serif);letter-spacing:-.01em;margin:0 0 14px;max-width:740px}
.hero p{font-size:16px;line-height:1.55;color:#D6E2F1;margin:0 0 22px;max-width:620px}
.trust{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 24px;font-size:13.5px}
.trust li{display:flex;align-items:center;gap:7px}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.main{max-width:1200px;margin:0 auto;padding:0 24px 24px}
.search{display:grid;grid-template-columns:2fr 1fr 1fr;margin-top:-48px;background:#fff;border:1px solid #C9D3DE;border-radius:6px;box-shadow:0 8px 24px rgba(11,60,117,.14)}
.fld{display:flex;flex-direction:column;gap:3px;padding:12px 16px;border-right:1px solid #E3E8EE;min-width:0}
.fld:last-child{border-right:0}
.fld span{font-size:12px;color:var(--text-2);font-weight:600}
.fld input,.fld select{border:0;background:transparent;font:15px var(--font);color:var(--text);width:100%;height:26px;outline:0}
.fld:focus-within{box-shadow:inset 0 -3px 0 var(--blue)}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 8px}
.chip{border:1px solid #C9D3DE;background:#fff;color:#33475B;border-radius:999px;padding:7px 14px;font-size:13.5px;cursor:pointer}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip b{font-weight:600;opacity:.7;margin-left:4px}

.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 14px}
.head h2{font:700 22px var(--serif);margin:0;flex:1}
.head select{height:34px;border:1px solid #C9D3DE;border-radius:4px;padding:0 8px;font-size:13px;background:#fff}
.view{display:flex}
.view button{height:34px;padding:0 12px;border:1px solid #C9D3DE;background:#fff;font-size:13px;cursor:pointer}
.view button:first-child{border-radius:4px 0 0 4px}
.view button:last-child{border-radius:0 4px 4px 0;border-left:0}
.view button.on{background:var(--blue);border-color:var(--blue);color:#fff}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:#fff;border:1px solid #D5DCE4;border-radius:6px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:border-color .15s}
.card:hover{border-color:var(--blue)}
.img{aspect-ratio:4/3;background:#E3EAF2;position:relative;display:flex;align-items:center;justify-content:center}
.img svg.ph{width:52px;height:52px;stroke:#9DB0C6;fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.ref{position:absolute;left:10px;bottom:10px;background:#fff;color:var(--blue);font:600 12px Consolas,monospace;padding:3px 8px;border-radius:3px;border-left:3px solid var(--red)}
.body{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.cat{font-size:12.5px;color:var(--text-2)}
.body h3{margin:0;font-size:17px;line-height:1.3;font-weight:600}
.loc{margin:0;display:flex;gap:5px;align-items:center;font-size:13.5px;color:#33475B}
.loc svg{width:14px;height:14px;flex:0 0 14px;stroke:var(--text-2);stroke-width:1.8}
.facts{font-size:13px;color:var(--text-2);display:flex;gap:6px 14px;flex-wrap:wrap}
.price{margin-top:auto;padding-top:12px;font:700 22px var(--serif);color:var(--blue);font-variant-numeric:tabular-nums}
.price.poa{font:600 15px var(--font);color:var(--warning)}
.grid.list{grid-template-columns:1fr}
.grid.list .card{flex-direction:row}
.grid.list .img{width:280px;flex:0 0 280px;aspect-ratio:auto;min-height:190px}
.empty{grid-column:1/-1;text-align:center;padding:56px 16px;border:1px dashed #C9D3DE;border-radius:6px;color:var(--text-2)}
.empty h3{font:700 18px var(--serif);color:var(--text);margin:0 0 6px}

.btn{height:38px;padding:0 16px;border:1px solid #C9D3DE;background:#fff;border-radius:4px;font-size:13.5px;cursor:pointer}
.btn:hover{background:#E7EEF7}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.p:hover{background:var(--blue-hover)}

/* Detail */
.page{max-width:1200px;margin:0 auto;padding:28px 24px}
.back{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.back h1{font:700 22px var(--serif);margin:0}
.live{font-size:12px;font-weight:600;color:#1E7B34;background:#E6F4EA;padding:3px 8px;border-radius:3px}
.dgrid{display:grid;grid-template-columns:1.5fr 1fr;gap:28px;align-items:start}
.gal{border:1px solid #D5DCE4;border-radius:6px;overflow:hidden}
.gal .img{aspect-ratio:auto;height:min(460px,52vw)}
.gal .img svg.ph{width:72px;height:72px}
.thumbs{display:flex;gap:8px;padding:10px}
.thumbs div{flex:1;height:68px;background:#E3EAF2;border:1px solid #C9D3DE;border-radius:4px}
.thumbs div.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.side{position:sticky;top:84px;display:flex;flex-direction:column;gap:14px}
.box{border:1px solid #D5DCE4;border-radius:6px;padding:20px}
.box .k{font-size:13.5px;color:var(--text-2)}
.big{font:700 32px var(--serif);color:var(--blue);margin:2px 0 8px}
.box p{margin:0 0 12px;color:var(--text-2)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:400;color:var(--text-2);padding:7px 0;width:44%}
td{padding:7px 0;font-weight:600}
tr+tr th,tr+tr td{border-top:1px solid #EEF1F5}
.col{display:flex;flex-direction:column;gap:8px}
.col .btn{height:44px;font-size:14px;width:100%}


.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0F172A;color:#fff;padding:10px 18px;border-radius:4px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.show{opacity:1}

@media (max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.dgrid{grid-template-columns:1fr}.side{position:static}}
@media (max-width:700px){
  .hdr{gap:12px;padding:0 16px}.logo small,.cta{display:none}
  .hero{padding:36px 16px 80px}.hero h1{font-size:28px}.hero p{font-size:15px}
  .main,.page{padding-left:16px;padding-right:16px}
  .search{grid-template-columns:1fr}.fld{border-right:0;border-bottom:1px solid #E3E8EE}.fld:last-child{border-bottom:0}
  .grid,.grid.list{grid-template-columns:1fr}.grid.list .card{flex-direction:column}.grid.list .img{width:auto;flex:none;aspect-ratio:4/3;min-height:0}
}

/* Inner pages */
.phero{background:var(--blue);color:#fff;padding:44px max(24px,calc((100% - 1200px)/2 + 24px)) 40px;border-bottom:4px solid var(--red)}
.phero h1{font:700 34px/1.2 var(--serif);margin:0 0 12px;letter-spacing:-.01em}
.phero p{margin:0;font-size:16px;line-height:1.55;color:#D6E2F1;max-width:680px}
.strip{background:#F3F6FA;border-bottom:1px solid #D5DCE4}
.strip div.in{max-width:1200px;margin:0 auto;padding:16px 24px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.strip.three div.in{grid-template-columns:repeat(3,1fr)}
.strip b{display:block;font:700 20px var(--serif);color:var(--blue)}
.strip span{font-size:13px;color:var(--text-2)}
.sec{max-width:1200px;margin:0 auto;padding:32px 24px 0}
.sec h2{font:700 24px var(--serif);margin:0 0 6px}
.sec>p.sub{margin:0 0 22px;color:var(--text-2);max-width:640px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:44px 1fr;gap:18px;padding-bottom:26px;position:relative}
.step:not(:last-child)::before{content:"";position:absolute;left:21px;top:44px;bottom:2px;width:2px;background:#D5DCE4}
.step .n{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font:700 17px var(--serif)}
.step h3{margin:2px 0 6px;font-size:18px}
.step p{margin:0 0 10px;color:#33475B;max-width:720px;line-height:1.6}
.safe{border-left:3px solid var(--red);background:#F6F9FC;padding:9px 14px;font-size:13.5px;max-width:720px}
.feat{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.feat div{border:1px solid #D5DCE4;border-radius:6px;padding:18px}
.feat h3{margin:0 0 6px;font-size:15.5px}
.feat p{margin:0;font-size:13.5px;color:var(--text-2);line-height:1.55}
.tw{overflow-x:auto;border:1px solid #D5DCE4;border-radius:6px}
.tw table{min-width:640px}
.tw th{background:#F3F6FA;padding:12px 16px;font-weight:600;color:var(--text);width:auto}
.tw td{padding:12px 16px;font-weight:400;vertical-align:top}
.tw td:first-child{font-weight:600;width:24%}
.tw td:last-child{color:var(--text-2)}
.tw tr+tr td{border-top:1px solid #EEF1F5}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0 0}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:start}
.card2{border:1px solid #D5DCE4;border-radius:6px;padding:22px}
.card2 h3{margin:0 0 4px;font:700 20px var(--serif)}
.card2>p{margin:0 0 18px;color:var(--text-2);font-size:13.5px}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:16px}
.f label,.f>span{font-size:13px;font-weight:600}
.f small{color:var(--text-2);font-size:12.5px}
.f input,.f select,.f textarea{border:1px solid #B7C3D1;border-radius:4px;padding:9px 11px;font:14.5px var(--font);width:100%;background:#fff}
.f textarea{min-height:110px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--blue);outline-offset:0;border-color:var(--blue)}
.f .err{color:var(--red);font-size:12.5px}
.f.bad input,.f.bad textarea{border-color:var(--red)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;margin-bottom:18px;cursor:pointer}
.chk input{margin-top:3px;width:16px;height:16px;accent-color:var(--blue)}
.okbox{text-align:center;padding:28px 12px}
.okbox .tk{width:48px;height:48px;border-radius:50%;background:#E6F4EA;color:#1E7B34;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px}
.okbox .tk svg{width:24px;height:24px}
.okbox code{display:inline-block;margin:10px 0 14px;background:#F3F6FA;border:1px solid #C9D3DE;padding:8px 14px;border-radius:4px;font:700 15px Consolas,monospace;color:var(--blue)}
.aside{display:flex;flex-direction:column;gap:16px}
.aside .card2{padding:18px}
.aside h3{font:700 16px var(--serif);margin:0 0 10px}
.aside p{margin:0 0 10px;font-size:13.5px;color:#33475B;line-height:1.55}
.note{background:#EAF1FA;border-left:3px solid var(--blue);padding:10px 12px;font-size:13.5px;border-radius:0 4px 4px 0}
.ck{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.ck li{display:flex;gap:10px;font-size:13.5px}
.ck svg{flex:0 0 18px;width:18px;height:18px;stroke:#1E7B34;margin-top:1px}
.ck small{display:block;color:var(--text-2)}
.kv{display:flex;gap:12px;padding:8px 0;font-size:13.5px}
.kv+.kv{border-top:1px solid #EEF1F5}
.kv span:first-child{flex:0 0 40%;color:var(--text-2)}
.kv span:last-child{font-weight:600}
.kv a{color:var(--blue)}
.fq{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.fq input{flex:1;min-width:220px;height:40px;border:1px solid #B7C3D1;border-radius:4px;padding:0 12px;font:14.5px var(--font)}
details{border:1px solid #D5DCE4;border-radius:6px;margin-bottom:10px;background:#fff}
details[open]{border-color:var(--blue)}
summary{cursor:pointer;padding:15px 18px;font-weight:600;font-size:15px;list-style:none;display:flex;gap:12px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;font-size:20px;color:var(--blue);line-height:1}
details[open] summary::after{content:"\2212"}
summary em{font:500 12px var(--font);font-style:normal;color:var(--blue);background:#EAF1FA;padding:3px 8px;border-radius:3px;white-space:nowrap}
details p{margin:0;padding:0 18px 18px;color:#33475B;line-height:1.65;max-width:760px}
.help{margin-top:24px;border:1px solid #D5DCE4;border-radius:6px;padding:20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:#F6F9FC}
.help div{flex:1;min-width:240px}
.help h3{margin:0 0 4px;font:700 18px var(--serif)}
.help p{margin:0;color:var(--text-2);font-size:13.5px}
@media (max-width:1000px){.two{grid-template-columns:1fr}.feat{grid-template-columns:repeat(2,1fr)}.strip div.in{grid-template-columns:repeat(2,1fr)}}
@media (max-width:700px){.phero{padding:32px 16px 28px}.phero h1{font-size:27px}.sec{padding:24px 16px 0}.row2,.feat{grid-template-columns:1fr}.step{grid-template-columns:36px 1fr;gap:12px}.step .n{width:36px;height:36px;font-size:15px}.step:not(:last-child)::before{left:17px;top:36px}.strip div.in{padding:14px 16px}}

.logo{display:flex;align-items:center;gap:14px;text-decoration:none;white-space:nowrap;font:inherit}
.logo .lg{height:52px;width:auto;display:block;mix-blend-mode:multiply}
.logo .mk{font-size:13px;color:var(--text-2);padding-left:14px;border-left:1px solid #D5DCE4;line-height:1.2}
.hdr{height:72px}
.ft{margin-top:48px;background:#F3F6FA;border-top:4px solid var(--red);max-width:none;padding:0;display:block;font-size:14px;color:#33475B}
.ft .in{max-width:1200px;margin:0 auto;padding:40px 24px 28px;display:grid;grid-template-columns:1.5fr 1fr 1.3fr 1.1fr;gap:32px}
.ft .lg{height:84px;width:auto;display:block;mix-blend-mode:multiply;margin:0 0 12px -2px}
.ft p{margin:0 0 8px;line-height:1.55;max-width:300px}
.ft h4{margin:0 0 12px;font:700 15px var(--serif);color:var(--blue)}
.ft ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.ft a{color:#33475B;text-decoration:none;cursor:pointer}
.ft a:hover{color:var(--blue);text-decoration:underline}
.ft .ct li,.ft .hr li{display:flex;flex-direction:column}
.ft .ct small,.ft .hr small{color:var(--text-2);font-size:12.5px}
.ft .bar{border-top:1px solid #D5DCE4}
.ft .bar div{max-width:1200px;margin:0 auto;padding:16px 24px;display:flex;gap:8px 24px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2)}
.ft .bar div span:first-child{flex:1;min-width:260px}
@media (max-width:1000px){.ft .in{grid-template-columns:1fr 1fr}}
@media (max-width:700px){.hdr{height:64px}.logo .lg{height:42px}.logo .mk{display:none}.ft .in{grid-template-columns:1fr;padding:32px 16px 20px;gap:26px}.ft .bar div{padding:14px 16px}}
</style>

<body>

<header class="hdr">
  <a class="logo" href="#" onclick="go('home');return false" aria-label="Surge Solutions marketplace home"><img class="lg" alt="Surge Solutions, partners in business growth"><span class="mk">Marketplace</span></a>
  <nav id="nav">
    <a data-p="home" class="on" onclick="go('home')">Buy Assets</a>
    <a data-p="how" onclick="go('how')">How It Works</a>
    <a data-p="kyc" onclick="go('kyc')">KYC &amp; Verification</a>
    <a data-p="faq" onclick="go('faq')">FAQ</a>
    <a data-p="contact" onclick="go('contact')">Contact</a>
  </nav>
  <button class="cta" onclick="go('kyc')">Get verified to buy</button>
</header>

<div id="app"></div>
<div class="toast" id="toast" role="status"></div>

<script>
const ASSETS=[
 {id:1,ref:'SRG-2026-0014',cat:'Residential',type:'4-bedroom detached house',loc:'East Legon, Accra',region:'Greater Accra',price:2850000,beds:4,baths:3,occ:'Vacant',desc:'Detached family home on a fenced plot with a boys quarters and covered parking. Title and valuation verified.'},
 {id:2,ref:'SRG-2026-0021',cat:'Residential',type:'3-bedroom townhouse',loc:'Tema Community 25',region:'Greater Accra',price:980000,beds:3,baths:2,occ:'Vacant',desc:'Townhouse in a gated community with shared amenities. Vacant possession on completion.'},
 {id:3,ref:'SRG-2026-0027',cat:'Commercial',type:'Office building, 3 floors',loc:'Ridge, Accra',region:'Greater Accra',price:7400000,beds:0,baths:0,occ:'Partly let',desc:'Three-storey office building close to the Ridge business district, with a basement car park.'},
 {id:4,ref:'SRG-2026-0033',cat:'Land',type:'Residential plot, 0.5 acre',loc:'Kasoa, Central Region',region:'Central',price:360000,beds:0,baths:0,occ:'',desc:'Half-acre plot with a registered indenture. Site is cleared and accessible by road.'},
 {id:5,ref:'SRG-2026-0038',cat:'Land',type:'Industrial land, 2 acres',loc:'Kumasi, Ashanti',region:'Ashanti',price:null,beds:0,baths:0,occ:'',desc:'Two acres of industrial-zoned land on the Kumasi ring road. Price available on request.'},
 {id:6,ref:'SRG-2026-0042',cat:'Residential',type:'2-bedroom apartment',loc:'Cantonments, Accra',region:'Greater Accra',price:640000,beds:2,baths:2,occ:'Tenanted',desc:'Second-floor apartment with a long-term tenant in place. Suits an investor buyer.'}
];
const BANDS={any:['Any price',0,Infinity],u500:['Under 500,000',0,5e5],'500m':['500,000 to 1M',5e5,1e6],'1m5':['1M to 5M',1e6,5e6],o5:['Over 5M',5e6,Infinity]};
const S={q:'',cat:'all',region:'all',price:'any',sort:'default',view:'grid'};
const fmt=n=>'GH₵ '+n.toLocaleString('en-US');
const tick='<svg class="i" viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg>';
const pin='<svg class="i" viewBox="0 0 24 24"><path d="M12 21s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>';
const ph='<svg class="ph" viewBox="0 0 24 24"><path d="M3 10l9-6 9 6"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>';

function filtered(){
  const b=BANDS[S.price],q=S.q.trim().toLowerCase();
  const l=ASSETS.filter(a=>{
    if(S.cat!=='all'&&a.cat!==S.cat)return false;
    if(S.region!=='all'&&a.region!==S.region)return false;
    if(S.price!=='any'&&!(a.price!==null&&a.price>=b[1]&&a.price<b[2]))return false;
    return !q||[a.ref,a.loc,a.type,a.region,a.cat].join(' ').toLowerCase().includes(q);
  });
  if(S.sort!=='default')l.sort((x,y)=>{if(x.price===null)return 1;if(y.price===null)return -1;return S.sort==='low'?x.price-y.price:y.price-x.price});
  return l;
}
function chips(){
  const cats=[...new Set(ASSETS.map(a=>a.cat))];
  const c=(v,l,n)=>`<button class="chip ${S.cat===v?'on':''}" onclick="S.cat='${v}';refresh()">${l}<b>${n}</b></button>`;
  return c('all','All assets',ASSETS.length)+cats.map(v=>c(v,v,ASSETS.filter(a=>a.cat===v).length)).join('');
}
function card(a){
  const facts=[a.beds?a.beds+' bed':'',a.baths?a.baths+' bath':'',a.occ].filter(Boolean);
  return `<article class="card" tabindex="0" role="link" onclick="detail(${a.id})" onkeydown="if(event.key==='Enter')detail(${a.id})">
    <div class="img">${ph}<span class="ref">${a.ref}</span></div>
    <div class="body"><div class="cat">${a.cat}</div><h3>${a.type}</h3><p class="loc">${pin}${a.loc}</p>
    ${facts.length?`<div class="facts">${facts.map(f=>`<span>${f}</span>`).join('')}</div>`:''}
    <div class="price ${a.price===null?'poa':''}">${a.price===null?'Price on application':fmt(a.price)}</div></div></article>`;
}
function results(){
  const l=filtered(),sel=(v,t)=>`<option value="${v}" ${S.sort===v?'selected':''}>${t}</option>`;
  const empty=`<div class="empty"><h3>No assets match these filters</h3><p>Clear the filters to see every live listing.</p><button class="btn p" onclick="Object.assign(S,{q:'',cat:'all',region:'all',price:'any',sort:'default'});go('home')">Clear filters</button></div>`;
  return `<div class="head"><h2>${l.length} ${l.length===1?'asset':'assets'} available</h2>
    <select aria-label="Sort" onchange="S.sort=this.value;refresh()">${sel('default','Sort: Featured')}${sel('low','Price: low to high')}${sel('high','Price: high to low')}</select>
    <div class="view"><button class="${S.view==='grid'?'on':''}" onclick="S.view='grid';refresh()">Grid</button><button class="${S.view==='list'?'on':''}" onclick="S.view='list';refresh()">List</button></div></div>
    <div class="grid ${S.view==='list'?'list':''}">${l.map(card).join('')||empty}</div>`;
}
function refresh(){document.getElementById('results').innerHTML=results();document.getElementById('chips').innerHTML=chips()}
function home(){
  const regions=[...new Set(ASSETS.map(a=>a.region))].sort();
  return `<section class="hero"><h1>Bank-repossessed property in Ghana, checked before it is listed</h1>
    <p>Every asset here has passed Surge Solutions' legal, title and valuation review. Browse, request a viewing and make an offer through us.</p>
    <ul class="trust"><li>${tick}Five-gate review before publishing</li><li>${tick}Buyers verified through KYC</li><li>${tick}Offers handled by Surge Solutions</li></ul></section>
  <div class="main"><div class="search" role="search">
    <label class="fld"><span>Search</span><input type="search" value="${S.q}" placeholder="Reference, town or property type" oninput="S.q=this.value;refresh()"></label>
    <label class="fld"><span>Region</span><select onchange="S.region=this.value;refresh()"><option value="all">All regions</option>${regions.map(r=>`<option ${S.region===r?'selected':''}>${r}</option>`).join('')}</select></label>
    <label class="fld"><span>Price (GH₵)</span><select onchange="S.price=this.value;refresh()">${Object.entries(BANDS).map(([k,v])=>`<option value="${k}" ${S.price===k?'selected':''}>${v[0]}</option>`).join('')}</select></label></div>
    <div class="chips" id="chips">${chips()}</div><div id="results">${results()}</div></div>
  ${FOOT}`;
}
function detail(id){
  const a=ASSETS.find(x=>x.id===id);
  document.getElementById('app').innerHTML=`<div class="page"><div class="back"><button class="btn" onclick="go('home')">← Back</button><h1>${a.type}</h1><span class="live">Live</span></div>
  <div class="dgrid"><div class="gal"><div class="img">${ph}</div><div class="thumbs"><div class="on"></div><div></div><div></div><div></div></div></div>
  <div class="side"><div class="box"><div class="k">${a.cat} · ${a.type}</div><div class="big">${a.price===null?'Price on application':fmt(a.price)}</div><p>${a.desc}</p>
    <table><tr><th>Reference</th><td>${a.ref}</td></tr><tr><th>Location</th><td>${a.loc}</td></tr><tr><th>Region</th><td>${a.region}</td></tr>${a.occ?`<tr><th>Occupancy</th><td>${a.occ}</td></tr>`:''}${a.beds?`<tr><th>Bedrooms</th><td>${a.beds}</td></tr>`:''}${a.baths?`<tr><th>Bathrooms</th><td>${a.baths}</td></tr>`:''}</table></div>
    <div class="box col"><button class="btn p" onclick="toast('Enquiry form would open')">Submit enquiry</button><button class="btn" onclick="toast('Viewing request form would open')">Request viewing</button><button class="btn" onclick="toast('Formal offer form would open')">Submit formal offer</button></div></div></div></div>
  ${FOOT}`;
  window.scrollTo(0,0);
}

function how(){
  const st=[
   ['Bank handover and five-gate legal review','Assets come directly from partner banks after loan default recovery. Before anything is published, Surge confirms the High Court writ of possession, runs a Lands Commission title search and a Collateral Registry search, obtains an independent chartered valuation, and inspects the property for occupancy.','Assets with active disputes go on legal hold and are never listed.'],
   ['Browse listings and enquire for free','Search verified listings across Greater Accra, Ashanti, Western and Central. Each profile shows specifications, the general location, photos and the reserve price. You can send enquiries without registering.','Exact coordinates and borrower details stay restricted until KYC is complete.'],
   ['Meet your recovery officer and verify your identity','A Surge asset recovery officer contacts you within 24 hours. Under the Anti-Money Laundering Act, 2020 (Act 1044), you verify your identity with your Ghana Card PIN and declare your source of funds before viewing or offering.','Compliance approval is typically under 24 hours, and your records stay confidential.'],
   ['Supervised inspection and formal offer','An officer and security escort take you on a physical viewing. You are welcome to bring a chartered surveyor or structural engineer. When you are satisfied, submit an offer with your price and payment structure: direct wire, mortgage facility or staged settlement.','Offers are logged, timestamped and sent to the bank’s Credit and Recovery Committee.'],
   ['Bank committee decision and legal conveyance','When the committee approves, Surge issues the disposition agreement and settlement invoice. You pay into the bank’s recovery escrow account, and Surge’s legal team coordinates the Deed of Assignment and Certificate of Purchase for title registration.','Every step is audited and Surge handles no cash.']];
  const ft=[['Clear title','Every listing is backed by court judgments, Lands Commission searches and Collateral Registry certification.'],['No broker markups','A fixed statutory commission of 4.0% rules out agent markups and surprise fees.'],['Escrow settlement','You pay into authorised bank recovery escrow accounts, never mobile money or personal accounts.'],['Built for the diaspora','Remote video walkthroughs, digital Ghana Card checks and power-of-attorney coordination for overseas buyers.']];
  const cmp=[['Title and verification','Court execution and five-gate Lands Commission audit','Unverified indentures and a high risk of multi-party litigation'],['Pricing','Independent chartered valuation with a published reserve price','Broker markups, often 10–25% above actual value'],['Dispute protection','Enforceable High Court writ of possession and police clearance','Exposure to land guards and customary stool injunctions'],['Payment','Designated bank escrow account with a formal invoice','Cash requests or unregulated third-party accounts'],['Conveyance','14–30 business days with a structured legal handover','Open-ended delays and incomplete registration']];
  return hero('How buying a bank-held asset works','Surge Solutions is the licensed disposition intermediary for commercial banks in Ghana. Five stages take you from browsing to a registered title.')
  +strip([['5 gates','Legal title clearance'],['4.0%','Fixed statutory fee'],['14–30 days','Bank conveyance target'],['100%','Bank escrow protected']])
  +`<div class="sec"><h2>The five stages</h2><p class="sub">Each stage has a safeguard built in, so you know what is protected before you move on.</p><ol class="steps">${st.map((x,i)=>`<li class="step"><div class="n">${i+1}</div><div><h3>${x[0]}</h3><p>${x[1]}</p><div class="safe"><b>Safeguard:</b> ${x[2]}</div></div></li>`).join('')}</ol></div>
  <div class="sec"><h2>What you get</h2><p class="sub">&nbsp;</p><div class="feat" style="margin-top:-14px">${ft.map(x=>`<div><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div></div>
  <div class="sec"><h2>Surge compared with the informal market</h2><p class="sub">How a regulated disposition differs from buying through a broker.</p><div class="tw"><table><thead><tr><th>Parameter</th><th>Surge Solutions</th><th>Informal market</th></tr></thead><tbody>${cmp.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div>${acts}</div><div style="height:8px"></div>`+FOOT;
}

function kyc(){
  const list=[['Ghana Card PIN','Issued by the National Identification Authority'],['Proof of acquisition capacity','Bank reference letter, facility pre-approval or funds statement'],['GhanaPost digital address','Your residential or business location'],['Corporate registration, if applicable','RGD Form 3 and a board resolution authorising the purchase']];
  const opt=a=>a.map(x=>`<option>${x}</option>`).join('');
  return hero('Buyer KYC and identity verification','Under the Anti-Money Laundering Act, 2020 (Act 1044), buyers complete due diligence before booking a supervised viewing or submitting an offer.')
  +strip([['Act 1044','Statutory compliance'],['Under 24 hours','Typical turnaround'],['Confidential','Protected buyer data']],'three')
  +`<div class="sec"><div class="two"><div class="card2" id="kycBox"><h3>Submit your KYC application</h3><p>Only authorised Surge compliance officers review your details.</p>
    <div class="f" id="k-name"><label for="kn">Full legal name</label><input id="kn" placeholder="As shown on your Ghana Card"><small>Individual or registered company name</small></div>
    <div class="row2"><div class="f" id="k-card"><label for="kc">Ghana Card PIN</label><input id="kc" placeholder="GHA-123456789-0"></div><div class="f" id="k-phone"><label for="kp">Phone number</label><input id="kp" placeholder="+233 24 000 0000"></div></div>
    <div class="f" id="k-email"><label for="ke">Email address</label><input id="ke" type="email" placeholder="you@domain.com"></div>
    <div class="row2"><div class="f"><label for="kb">Buyer category</label><select id="kb">${opt(['Individual Ghanaian resident','Registered company or enterprise','Diaspora Ghanaian investor','Foreign national or international investor'])}</select></div><div class="f"><label for="ks">Source of funds</label><select id="ks">${opt(['Personal savings and earnings','Business revenue or retained earnings','Bank mortgage or pre-approved facility','Diaspora remittances','Proceeds from a previous asset sale'])}</select></div></div>
    <div class="f"><label for="kr">Target asset reference (optional)</label><input id="kr" placeholder="e.g. SRG-2026-0014"><small>Leave blank for general buyer pre-approval</small></div>
    <label class="chk"><input type="checkbox" id="kx"><span>I confirm these details are accurate and consent to verification with the National Identification Authority and partner bank compliance systems under Act 1044.</span></label>
    <button class="btn p" onclick="kycSubmit()">Submit for verification</button></div>
  <div class="aside"><div class="card2"><h3>Why KYC is required</h3><p>Repossessed assets are under court custody and bank administration. Verifying buyers prevents trespass, protects borrower privacy and blocks fraudulent bids.</p><div class="note"><b>Browsing is always free.</b> You only need KYC to book a viewing or make an offer.</div></div>
  <div class="card2"><h3>What to have ready</h3><ul class="ck">${list.map(x=>`<li>${ck}<span><b>${x[0]}</b><small>${x[1]}</small></span></li>`).join('')}</ul></div>
  <div class="card2"><h3>How we handle your data</h3><div class="kv"><span>Purpose</span><span>Bank recovery due diligence only</span></div><div class="kv"><span>Reviewed by</span><span>Surge compliance officers</span></div><div class="kv"><span>Sharing</span><span>Never given to brokers or marketers</span></div></div>
  <p style="font-size:12.5px;color:var(--text-2);margin:0">Under Act 1044, Surge must report suspicious transaction structures to the Financial Intelligence Centre.</p></div></div></div><div style="height:32px"></div>`+FOOT;
}
function bad(id,msg){const e=document.getElementById(id);e.classList.add('bad');if(!e.querySelector('.err'))e.insertAdjacentHTML('beforeend','<span class="err">'+msg+'</span>')}
function clr(ids){ids.forEach(i=>{const e=document.getElementById(i);e.classList.remove('bad');const r=e.querySelector('.err');if(r)r.remove()})}
function done(box,title,msg,ref,btn,page){document.getElementById(box).innerHTML=`<div class="okbox"><div class="tk"><svg class="i" viewBox="0 0 24 24" style="width:24px;height:24px"><path d="M5 13l4 4L19 7"/></svg></div><h3 style="margin:0 0 6px;font:700 20px var(--serif)">${title}</h3><p style="color:var(--text-2);margin:0">${msg}</p><code>Reference: ${ref}</code><br><button class="btn p" onclick="go('${page}')">${btn}</button></div>`;window.scrollTo(0,0)}
function kycSubmit(){
  const ids=['k-name','k-card','k-phone','k-email'];clr(ids);let ok=true;
  const v=i=>document.getElementById(i).value.trim();
  [['k-name','kn','Enter your full legal name.'],['k-card','kc','Enter your Ghana Card PIN.'],['k-phone','kp','Enter a phone number with country code.'],['k-email','ke','Enter your email address.']].forEach(a=>{if(!v(a[1])){bad(a[0],a[2]);ok=false}});
  if(!ok)return toast('Complete the highlighted fields.');
  if(!document.getElementById('kx').checked)return toast('Tick the consent box to continue.');
  done('kycBox','Application received','Our compliance desk will confirm by SMS and email within 24 hours. Quote this reference when booking a viewing.','KYC-2026-'+Math.floor(100000+Math.random()*900000),'Browse assets','home');
}

const FAQ=[
['Legal & title','Where do the listed assets come from?','They come directly from partner commercial banks and licensed deposit-taking institutions in Ghana: collateral repossessed after judicial default, High Court writs of execution or settlement recoveries. Surge is the intermediary these institutions authorise to market and sell them.'],
['Legal & title','How does Surge make sure properties are free from litigation and land guards?','Every property passes a five-gate audit: High Court writ of possession, Lands Commission search of the root of title, Collateral Registry search, independent valuation, and a physical occupancy inspection. Assets with family or title disputes go on legal hold and are never listed.'],
['Legal & title','Which title documents will I receive?','You receive a Deed of Assignment or Conveyance executed by the bank (attested by the High Court registrar where required), the Certificate of Purchase or Vesting Deed, and certified site plans so you can register the title at the Lands Commission.'],
['Pricing & terms','Are prices negotiable, and what is the reserve price?','The reserve price is the liquidation threshold set by independent chartered valuers and approved by the bank’s Credit Committee. You can offer at, above or near it with reasons. The committee weighs price, settlement speed and payment method.'],
['Pricing & terms','Which payment structures are accepted?','Three: a direct bank wire or RTGS payment into the bank’s recovery escrow account; a pre-approved mortgage from a registered Ghanaian bank; or a staged settlement, typically 10–20% on acceptance with the balance paid over 30 to 90 days.'],
['Pricing & terms','Does Surge charge buyers broker or search fees?','No. Surge earns a regulated commission, typically 4.0%, already included in the approved transaction. There are no upfront inspection or registration fees, and searching and enquiring are free.'],
['Viewing & process','Can I inspect a property before making an offer?','Yes. Inspections are supervised and booked in advance through Surge, with an asset recovery officer and security escort. Unescorted visits are not allowed.'],
['Viewing & process','Can I bring my own engineer, valuer or lawyer?','We encourage it. You can bring chartered surveyors, structural engineers or legal counsel and carry out measurements and structural checks during the appointment.'],
['Viewing & process','Why do I need KYC before viewing or offering?','Repossessed property is under sensitive court and banking administration. Ghana Card verification and proof of acquisition capacity protect the asset from trespass, preserve borrower privacy and meet Bank of Ghana requirements under Act 1044.'],
['Diaspora & foreign','Can Ghanaians abroad buy remotely?','Yes. Overseas buyers can take a live video walkthrough, verify digitally with a Ghana Card PIN or passport, and appoint a local representative or lawyer under our power-of-attorney process.'],
['Diaspora & foreign','Can foreign nationals or companies buy land?','Under Article 266 of the 1992 Constitution and the Land Act, 2020 (Act 1036), non-citizens and foreign companies can hold land on renewable leasehold of up to 50 years. Surge checks the unexpired term on every listing before publishing.'],
['Diaspora & foreign','How do I send funds from abroad?','Send settlement funds only by SWIFT or RTGS wire into the bank’s designated recovery escrow account in Ghana. Surge never accepts cash through informal transmitters or personal mobile money.']];
const FS={cat:'all',q:''};
function faqList(){
  const q=FS.q.toLowerCase(),l=FAQ.filter(f=>(FS.cat==='all'||f[0]===FS.cat)&&(!q||(f[1]+f[2]).toLowerCase().includes(q)));
  return l.length?l.map(f=>`<details><summary>${f[1]}<em>${f[0]}</em></summary><p>${f[2]}</p></details>`).join(''):'<div class="empty"><h3>No questions match</h3><p>Try a different keyword or category.</p></div>';
}
function faqChips(){const cats=[...new Set(FAQ.map(f=>f[0]))];const c=(v,l)=>`<button class="chip ${FS.cat===v?'on':''}" onclick="FS.cat='${v.replace("'","\\'")}';faqRefresh()">${l}</button>`;return c('all','All questions')+cats.map(v=>c(v,v)).join('')}
function faqRefresh(){document.getElementById('fl').innerHTML=faqList();document.getElementById('fc').innerHTML=faqChips()}
function faq(){
  return hero('Frequently asked questions','Answers on title, pricing, viewings and buying from abroad.')
  +`<div class="sec"><div class="fq"><input type="search" aria-label="Filter questions" placeholder="Filter questions by keyword" oninput="FS.q=this.value;faqRefresh()"></div><div class="chips" id="fc" style="margin:0 0 18px">${faqChips()}</div><div id="fl">${faqList()}</div>
  <div class="help"><div><h3>Asking about a specific asset?</h3><p>Our asset recovery officers can advise on title reports, site surveys and how to structure an offer.</p></div><button class="btn p" onclick="go('contact')">Send an enquiry</button><button class="btn" onclick="go('home')">Browse listings</button></div></div><div style="height:8px"></div>`+FOOT;
}

function contact(){
  const opt=a=>a.map(x=>`<option>${x}</option>`).join('');
  return hero('Contact Surge Solutions','Send your enquiry to the asset desk. A recovery specialist will review it and get back to you.')
  +strip([['Accra','Head office'],['Under 4 hours','Average response'],['Mon to Sat','Open six days']],'three')
  +`<div class="sec"><div class="two"><div class="card2" id="ctBox"><h3>Send an enquiry</h3><p>Fields marked with an asterisk are required.</p>
    <div class="f" id="c-name"><label for="cn">Full name *</label><input id="cn" placeholder="Your full name"></div>
    <div class="row2"><div class="f" id="c-phone"><label for="cp">Phone number *</label><input id="cp" placeholder="+233 24 000 0000"></div><div class="f" id="c-email"><label for="ce">Email address *</label><input id="ce" type="email" placeholder="you@domain.com"></div></div>
    <div class="row2"><div class="f"><label for="ct">Nature of enquiry</label><select id="ct">${opt(['Asset details and reserve price','Supervised viewing request','Diaspora advisory and remote purchase','Corporate or bulk acquisition','Title verification and court writ questions','General information'])}</select></div><div class="f"><label for="cm">Preferred contact</label><select id="cm">${opt(['Phone call','WhatsApp message','Email'])}</select></div></div>
    <div class="f"><label for="cr">Asset reference (optional)</label><input id="cr" placeholder="e.g. SRG-2026-0014"></div>
    <div class="f" id="c-msg"><label for="cg">Message *</label><textarea id="cg" placeholder="Describe your interest, preferred locations, budget range or questions"></textarea></div>
    <button class="btn p" onclick="contactSubmit()">Send enquiry</button></div>
  <div class="aside"><div class="card2"><h3>Head office</h3><div class="kv"><span>Address</span><span>Surge Asset Recovery Centre, 4th Floor, Ridge Financial Enclave, Independence Avenue, Accra</span></div><div class="kv"><span>Digital address</span><span>GA-019-4821</span></div><div class="kv"><span>Postal address</span><span>P.O. Box CT 4892, Cantonments, Accra</span></div></div>
  <div class="card2"><h3>Talk to us</h3><div class="kv"><span>Switchboard</span><span>+233 (0) 30 274 0000</span></div><div class="kv"><span>Asset advisory</span><span>+233 (0) 24 455 0192</span></div><div class="kv"><span>Diaspora WhatsApp</span><span>+233 (0) 50 123 4567</span></div><div class="kv"><span>Enquiries</span><span><a href="mailto:enquiries@surge.gh">enquiries@surge.gh</a></span></div><div class="kv"><span>Legal and compliance</span><span><a href="mailto:legal@surge.gh">legal@surge.gh</a></span></div><div class="kv"><span>Buyer KYC</span><span><a href="mailto:kyc@surge.gh">kyc@surge.gh</a></span></div></div>
  <div class="card2"><h3>Opening hours</h3><div class="kv"><span>Monday to Friday</span><span>08:00 to 17:00 GMT</span></div><div class="kv"><span>Saturday</span><span>09:00 to 14:00 GMT, supervised viewings only</span></div><div class="kv"><span>Sunday and holidays</span><span>Closed</span></div></div></div></div></div><div style="height:32px"></div>`+FOOT;
}
function contactSubmit(){
  const ids=['c-name','c-phone','c-email','c-msg'];clr(ids);let ok=true;const v=i=>document.getElementById(i).value.trim();
  [['c-name','cn','Enter your name.'],['c-phone','cp','Enter a phone number.'],['c-email','ce','Enter your email address.'],['c-msg','cg','Tell us how we can help.']].forEach(a=>{if(!v(a[1])){bad(a[0],a[2]);ok=false}});
  if(!ok)return toast('Complete the highlighted fields.');
  done('ctBox','Enquiry sent','Your enquiry is with the asset desk. We will reply by '+document.getElementById('cm').value.toLowerCase()+' shortly.','ENQ-2026-'+Math.floor(100000+Math.random()*900000),'Back to listings','home');
}
const PAGES={home,how,kyc,faq,contact};
function go(p){
  document.getElementById('app').innerHTML=PAGES[p]();
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.p===p));
  window.scrollTo(0,0);
}

document.querySelectorAll('.logo .lg').forEach(i=>i.src=LOGO);
go('home');
</script>
</body>
</html>
